<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#166534" />
		<title>Web Admin Offline</title>
		<style>
			:root {
				color: #17231b;
				background: #f8faf7;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1rem;
			}
			main {
				max-width: 34rem;
				border: 1px solid #cdd8cf;
				border-radius: 0.75rem;
				background: #ffffff;
				padding: 1.25rem;
				box-shadow: 0 12px 36px rgb(22 101 52 / 0.12);
			}
			p {
				line-height: 1.6;
				margin: 0.5rem 0 0;
			}
			.badge {
				color: #166534;
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="badge">Web Admin Offline</div>
			<h1>Jaringan belum tersedia</h1>
			<p>Halaman admin tidak disimpan sebagai cache sensitif. Buka kembali saat koneksi tersedia, atau lanjutkan menulis jika komposer Bank Soal masih terbuka di tab ini.</p>
		</main>
	</body>
</html>

<!doctype html>
<html lang="id" data-theme="cerberus">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var key = 'mtsn2kolut:theme';
				var pref = 'system';
				try {
					var s = localStorage.getItem(key);
					if (s === 'light' || s === 'dark' || s === 'system') pref = s;
				} catch (_) {}
				var dark = false;
				try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
				var resolved = pref === 'dark' || (pref === 'system' && dark) ? 'dark' : 'light';
				document.documentElement.classList.toggle('dark', resolved === 'dark');
				document.documentElement.dataset.theme = pref;
				document.documentElement.dataset.resolvedTheme = resolved;
				document.documentElement.style.colorScheme = resolved;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

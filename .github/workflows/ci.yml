name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Secret scan
        run: python3 scripts/scan-secrets.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core-api/go.mod
      - name: Go test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Svelte check
        run: npm run check
      - name: Unit tests
        run: npm run test:unit

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pusaka-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/pusaka-worker/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

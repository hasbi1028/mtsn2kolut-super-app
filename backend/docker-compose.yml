services:
  postgres:
    image: postgres:16-alpine
    container_name: pusaka-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-pusaka}
      POSTGRES_USER:     ${POSTGRES_USER:-pusaka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pusaka_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d   # auto-run on first start
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pusaka} -d ${POSTGRES_DB:-pusaka}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
